<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#701A75" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M120 130 Q120 160 90 160 Q120 160 120 190 Q120 160 150 160 Q120 160 120 130 Z" />
    <path d="M400 120 Q400 145 375 145 Q400 145 400 170 Q400 145 425 145 Q400 145 400 120 Z" />
    <circle cx="390" cy="220" r="8"/>
    <circle cx="110" cy="240" r="6"/>
  </g>

  <!-- Crown Base & Spikes -->
  <g filter="url(#glow)">
    <path d="M110 350 L140 210 L210 270 L256 160 L302 270 L372 210 L402 350 Z" 
          fill="url(#goldGrad)" stroke="#CA8A04" stroke-width="8" stroke-linejoin="round"/>
    <!-- Bottom Rim -->
    <path d="M100 340 Q256 370 412 340 L412 380 Q256 410 100 380 Z" 
          fill="url(#goldGrad)" stroke="#CA8A04" stroke-width="8"/>
  </g>

  <!-- Jewels on Spikes -->
  <!-- Left -->
  <circle cx="140" cy="205" r="16" fill="#EC4899" stroke="#BE185D" stroke-width="4"/>
  <circle cx="140" cy="200" r="5" fill="#FFFFFF"/>
  <!-- Middle Left -->
  <circle cx="210" cy="265" r="13" fill="#60A5FA" stroke="#2563EB" stroke-width="4"/>
  <!-- Center (Big Ruby/Diamond) -->
  <polygon points="256,125 275,155 256,180 237,155" fill="#F43F5E" stroke="#BE123C" stroke-width="4"/>
  <circle cx="256" cy="150" r="5" fill="#FFFFFF"/>
  <!-- Middle Right -->
  <circle cx="302" cy="265" r="13" fill="#60A5FA" stroke="#2563EB" stroke-width="4"/>
  <!-- Right -->
  <circle cx="372" cy="205" r="16" fill="#EC4899" stroke="#BE185D" stroke-width="4"/>
  <circle cx="372" cy="200" r="5" fill="#FFFFFF"/>

  <!-- Rim Gems -->
  <circle cx="160" cy="365" r="12" fill="#A855F7" stroke="#7E22CE" stroke-width="3"/>
  <circle cx="256" cy="375" r="15" fill="#F43F5E" stroke="#BE123C" stroke-width="4"/>
  <circle cx="352" cy="365" r="12" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>

  <!-- Star sparkle center -->
  <path d="M256 210 Q256 230 236 230 Q256 230 256 250 Q256 230 276 230 Q256 230 256 210 Z" fill="#FFFFFF"/>
</svg>
